<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Substack Editor Dark Mode</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="moon" aria-hidden="true"><img src="icons/icon48.png" width="36" height="36" alt=""></div>
    <h1>A quieter place to write.</h1>
    <label><span>Dark editor</span><input id="enabled" type="checkbox" role="switch" checked disabled></label>
    <p id="status" role="status">Loading preference…</p>
    <p class="note">Only changes how drafts look on your screen. Turn off to check original colors or preview your post.</p>
    <script src="popup.js"></script>
  </body>
</html>
